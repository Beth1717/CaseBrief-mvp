<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CaseBrief × UMG host-adoption candidate</title>
<style>
html,body{height:100%;margin:0;background:#100e16;color:#f5f2fb;font-family:Inter,system-ui,sans-serif}body{display:grid;grid-template-rows:auto 1fr}.status{padding:10px 14px;border-bottom:1px solid #51445f;background:#1c1824;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status b{font-family:Georgia,serif;font-weight:500}.pill{border:1px solid #51445f;border-radius:999px;padding:4px 8px;font-size:12px;color:#c7adff}.ok{color:#79e0b6}.warn{color:#ffdb94}iframe{width:100%;height:100%;border:0;background:#100e16}
</style>
</head>
<body>
<div class="status"><b>CaseBrief × UMG v0.2.1 host-adoption candidate</b><span id="state" class="pill warn">installing guarded host controls…</span><span class="pill">synthetic data only</span></div>
<iframe id="casebrief" name="casebrief-guarded" src="../index.html" title="CaseBrief guarded host-adoption demo"></iframe>
<script>
const frame=document.getElementById('casebrief');
const state=document.getElementById('state');
frame.addEventListener('load',()=>{
  try{
    if(!frame.contentWindow.caseBriefHostControls||!frame.contentWindow.applicationAllowed())throw new Error('startup authorization/control installation failed');
    state.textContent='guarded host controls active';
    state.className='pill ok';
  }catch(err){state.textContent='integration blocked: '+err.message;state.className='pill warn'}
});
</script>
</body>
</html>
