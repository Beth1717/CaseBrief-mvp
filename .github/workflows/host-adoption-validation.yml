name: Host adoption validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the PR head itself, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Syntax-check opt-in live UMG integration test
        run: node --check analysis/tests/live-umg.cjs
      - name: Run new document analysis tests
        run: npm run test:analysis
      - name: Record synthetic evaluation and document benchmark
        run: |
          mkdir -p readiness/results
          npm run --silent evaluate:analysis > readiness/results/analysis-coverage.json
          npm run --silent benchmark:documents > readiness/results/document-benchmark.json
      - name: Run all existing, UMG host, ingestion, and analysis browser suites
        shell: bash
        run: |
          set -u
          printf 'Exact Git HEAD: %s\n' "$(git rev-parse HEAD)" | tee validation-receipt.txt
          python3 -m http.server 8765 --bind 127.0.0.1 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          failed=0
          for suite in \
            analysis/tests/browser.cjs \
            tests/state.cjs \
            tests/analysis-receipt-import.cjs \
            tests/ingestion.cjs \
            tests/browser-ingestion.cjs \
            tests/document-library.cjs \
            tests/browser-document-library.cjs \
            tests/browser-research-survey.cjs \
            tests/review-receipt.cjs \
            tests/pilot-scorecard.cjs \
            tests/browser-review-receipt.cjs \
            tests/investor-demo.cjs \
            tests/browser-investor-demo.cjs \
            tests/browser.cjs \
            tests/idaho-pretrial.cjs \
            tests/browser-idaho-pretrial.cjs \
            tests/pilot-findings-cri.cjs \
            tests/browser-pilot-findings-cri.cjs \
            integration/tests/umg-runtime-contract-v0.1.cjs \
            integration/tests/umg-runtime-rev2.cjs \
            integration/tests/umg-runtime-boundary.cjs \
            integration/tests/synthetic-review-host.cjs \
            integration/tests/host-adoption.cjs \
            integration/tests/browser-host-adoption.cjs \
            integration/tests/casebrief-sleeve-contract.cjs \
            integration/tests/remediation.cjs \
            integration/tests/browser-remediation.cjs \
            integration/tests/decision-security.cjs \
            integration/tests/browser-control-failure.cjs; do
            printf '\n$ node %s\n' "$suite" | tee -a validation-receipt.txt
            node "$suite" 2>&1 | tee -a validation-receipt.txt
            status=${PIPESTATUS[0]}
            printf 'EXIT %s: %s\n' "$suite" "$status" | tee -a validation-receipt.txt
            if ((status != 0)); then failed=1; fi
          done
          exit "$failed"
      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-adoption-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            validation-receipt.txt
            server.log
            readiness/results/
          if-no-files-found: ignore
