<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CaseBrief MVP</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Case<span>Brief</span> <span class="badge">MVP • synthetic demo</span></div>
  <div class="controls">
    <label>Active case<select id="casePicker" onchange="switchCase(this.value)"></select></label>
    <button class="btn" onclick="showView('assistant')">Ask CaseBrief AI</button>
    <button class="btn ghost" onclick="showView('landing')">Public view</button>
  </div>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="app"></main>
</div>
<div id="detailRoot"></div>
<script src="seed.js"></script>
<script src="core.js"></script>
<script src="views-matter.js"></script>
<script src="views-work.js"></script>
<script src="views-comm.js"></script>
<script src="views-system.js"></script>
<script src="actions.js"></script>
</body>
</html>
