<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" />
<title>CaseBrief MVP</title>
<link rel="stylesheet" href="styles.css?v=20260916d">
<link rel="stylesheet" href="security.css?v=20260916d">
</head>
<body>
<div class="topbar">
  <div class="brand">Case<span>Brief</span> <span class="badge">MVP • synthetic demo</span></div>
  <div class="controls">
    <label>Active case<select id="casePicker" onchange="switchCase(this.value)"></select></label>
    <span id="roleControl"></span>
    <button class="btn" onclick="guardedView('ai_use','assistant')">Ask CaseBrief AI</button>
    <button class="btn ghost" onclick="showView('security')">Security</button>
    <button class="btn ghost" onclick="togglePrivacyMode()">Privacy</button>
    <button class="btn ghost" onclick="lockSession('manual')">Lock</button>
    <button class="btn ghost" onclick="showView('landing')">Public view</button>
  </div>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="app"></main>
</div>
<div id="detailRoot"></div>
<div id="securityToast" class="security-toast" hidden></div>
<script src="seed.js?v=20260916d"></script>
<script src="security.js?v=20260916d"></script>
<script src="core.js?v=20260916d"></script>
<script src="views-matter.js?v=20260916d"></script>
<script src="views-work.js?v=20260916d"></script>
<script src="views-comm.js?v=20260916d"></script>
<script src="views-system.js?v=20260916d"></script>
<script src="actions.js?v=20260916d"></script>
<script src="security-runtime.js?v=20260916d"></script>
<script src="demo-capabilities.js?v=20260916d"></script>
</body>
</html>
